services:
  # ────────────────────────────────────────────────────────────────
  # PostgreSQL
  # ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: support-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support_app
    ports:
      - "5432:5432"
    volumes:
      # Named volume keeps data across container restarts.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready exits 0 once postgres is accepting connections.
      test: ["CMD-SHELL", "pg_isready -U postgres -d support_app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ────────────────────────────────────────────────────────────────
  # Backend  (Node / Express / Prisma / ts-node-dev)
  # ────────────────────────────────────────────────────────────────
  backend:
    build:
      # Root context so the Dockerfile can reach both root package.json
      # and backend/ in a single build invocation.
      context: .
      dockerfile: backend/Dockerfile
    container_name: support-app-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: "4000"
      APP_NAME: support-app-backend
      APP_VERSION: 1.0.0
      # Use the postgres service name — containers talk over the internal
      # Docker bridge network, not via localhost.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/support_app?schema=public
      LOG_LEVEL: info
      # Browser always reaches the backend through Docker's host port mapping.
      CORS_ORIGIN: http://localhost:5173
      SENTRY_DSN: ""
      SENTRY_TRACES_SAMPLE_RATE: "0.1"
      # chokidar polls for file changes instead of using inotify — required
      # for reliable hot reload on Docker Desktop (macOS / Windows virtio-fs).
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Mount source directories so ts-node-dev picks up edits immediately.
      - ./backend/src:/app/backend/src
      - ./backend/prisma:/app/backend/prisma
      # Named volume shadows node_modules so the host directory never
      # overwrites the packages installed inside the image.
      - backend_node_modules:/app/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  # ────────────────────────────────────────────────────────────────
  # Frontend  (React / Vite / TypeScript)
  # ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: support-app-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # VITE_ vars are picked up by Vite's dev server and injected into
      # import.meta.env in the browser bundle.
      # The browser connects to the backend through the Docker host port
      # mapping — localhost:4000 is correct here (not the service name).
      VITE_API_BASE_URL: http://localhost:4000
      VITE_APP_NAME: Support App
      VITE_APP_ENV: development
      VITE_SENTRY_DSN: ""
      # Enable chokidar polling for Vite file watcher (same reason as backend).
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/src:/app/frontend/src
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
