# netlify.toml

[build]
  command   = "npm install && npx vite build --config vite.spa.config.ts"
  publish   = "dist"
  ignore    = "exit 1"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION    = "18"
  NPM_FLAGS       = "--legacy-peer-deps"
